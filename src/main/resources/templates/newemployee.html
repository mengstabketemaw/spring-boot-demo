<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="ISO-8859-1">
  <title>Employee Management System</title>
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
        crossorigin="anonymous">
</head>
<body>
<style>
  .sidebar {
    height: 100vh;
    width: 250px;
    position: fixed;
    top: 0;
    left: 0;
    background-color: #343a40;
    padding-top: 20px;
    color: white;
  }
  .sidebar a {
    padding: 10px 15px;
    text-decoration: none;
    font-size: 18px;
    display: block;
    color: white;
  }
  .sidebar a:hover {
    background-color: #495057;
  }
  .content {
    margin-left: 260px;
    padding: 20px;
  }
  .topbar {
    background-color: #007bff;
    padding: 10px;
    color: white;
  }
</style>
<div class="topbar d-flex justify-content-between px-3">
  <div>Company Name</div>
  <nav>
    <a href="#" class="text-white mx-2">Home</a>
    <a href="#" class="text-white mx-2">About</a>
    <a href="#" class="text-white mx-2">Contact</a>
  </nav>
</div>

<div class="sidebar">
  <h4 class="text-center">Menu</h4>
  <a href="#">Dashboard</a>
  <a href="#">Employees</a>
  <a href="#">Departments</a>
  <a href="#">Reports</a>
  <a href="#">Settings</a>
</div>
<div class="content">
  <h1>Employee Management System</h1>
  <hr>
  <h2>Save Employee</h2>

  <form action="#" th:action="@{/save}" th:object="${employee}"
        method="POST">
    <input type="text" th:field="*{name}" placeholder="Employee Name"
           class="form-control mb-4 col-4"> <input type="text"
                                                   th:field="*{email}" placeholder="Employee Email"
                                                   class="form-control mb-4 col-4">

    <button type="submit" class="btn btn-info col-2">Save
      Employee</button>
  </form>

  <hr>

  <a th:href="@{/}"> Back to Employee List</a>
</div>
</body>
</html>
