<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Employee</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
    <style>
        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #343a40;
            padding-top: 20px;
            color: white;
        }
        .sidebar a {
            padding: 10px 15px;
            text-decoration: none;
            font-size: 18px;
            display: block;
            color: white;
        }
        .sidebar a:hover {
            background-color: #495057;
        }
        .content {
            margin-left: 260px;
            padding: 20px;
        }
        .topbar {
            background-color: #007bff;
            padding: 10px;
            color: white;
        }
    </style>
</head>
<body>
<div class="topbar d-flex justify-content-between px-3">
    <div>Company Name</div>
    <nav>
        <a href="#" class="text-white mx-2">Home</a>
        <a href="#" class="text-white mx-2">About</a>
        <a href="#" class="text-white mx-2">Contact</a>
    </nav>
</div>

<div class="sidebar">
    <h4 class="text-center">Menu</h4>
    <a href="#">Dashboard</a>
    <a href="#">Employees</a>
    <a href="#">Departments</a>
    <a href="#">Reports</a>
    <a href="#">Settings</a>
</div>

<div class="content">
    <div class="container my-2 text-center">
        <h3>Employee List</h3>
        <a th:href="@{/addnew}" class="btn btn-primary btn-sm mb-3">Add Employee</a>
        <table style="width:80%" border="1" class="table table-striped table-responsive-md">
            <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="employee:${allemplist}">
                <td th:text="${employee.name}"></td>
                <td th:text="${employee.email}"></td>
                <td>
                    <a th:href="@{/showFormForUpdate/{id}(id=${employee.id})}" class="btn btn-primary">Update</a>
                    <a th:href="@{/deleteEmployee/{id}(id=${employee.id})}" class="btn btn-danger">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
